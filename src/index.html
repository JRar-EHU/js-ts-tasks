<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML CSS Task</title>
  <link rel="icon" type="image/png" href="assets/sadcat.png">
  <link rel="stylesheet" href="./style.css" />
  <script src="./iphone.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>
<iphone-frame>
  <main>
    <header  class="profile-topBar">
      <div><img src="assets/Back.png" alt="Back"></div>
      <div> user_name </div>
      <div><img src="assets/More.png" alt="More"></div>
    </header>
    <section class="profile">
      <img src="assets/logo.png" width="70px">
      <div>
        <p>129</p>
        <p>Posts</p>
      </div>
      <div>
        <p>3680</p>
        <p>Followers</p>
      </div>
      <div>
        <p>230</p>
        <p>Following</p>
      </div>
    </section>
    <section class="profile-bio">
      <p> Name </p>
      <p class="profile-bio-business"> Local business</p>
      <p class="profile-bio-website"> www.website.com </p>
    </section>
    <section class="actions">
      <div class="actions-container actions-container-active">
        <div> Follow</div>
      </div>
      <div class="actions-container">
        <div> Message</div>
      </div>
      <div class="actions-container">
        <div> Email</div>
      </div>
      <div class="actions-container actions-container-more">
        <img src="assets/Vector%202.png" alt="more">
      </div>
    </section>
    <section class="highlights">
      <div class="highlights-container">
        <div class="highlight-border">
          <div class="highlight-icon">
            <img src="assets/Vector.png" width="30px" height="30px">
          </div>
        </div>
        <div>Highlight</div>
      </div>
      <div class="highlights-container">
        <div class="highlight-border">
          <div class="highlight-icon"><img src="assets/Union.png" width="30px" height="30px"></div>
        </div>
        <div>Highlight</div>
      </div>
      <div class="highlights-container">
        <div class="highlight-border">
          <div class="highlight-icon"><img src="assets/Union(1).png" width="30px" height="30px"></div>
        </div>
        <div>Highlight</div>
      </div>
      <div class="highlights-container">
        <div class="highlight-border">
          <div class="highlight-icon"><img src="assets/Vector(1).png" width="30px" height="30px"></div>
        </div>
        <div>Highlight</div>
      </div>
    </section>
    <section class="gallery-top">
      <div class="gallery-top-container active" >
        <img src="assets/photos.png" alt="b">
      </div>
      <div class="gallery-top-container">
        <img src="assets/tags.png" alt="b">
      </div>
    </section>
    <section class="gallery-picGrid">
      <div class="gallery-prev">
        <img src="assets/Img-01.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-02.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-03.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-04.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-05.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-06.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-07.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-08.png" class="gallery-pic">
      </div>
      <div class="gallery-prev">
        <img src="assets/Img-09.png" class="gallery-pic"></div>
    </section>
    <footer class="footer">
      <nav class="footer-container">
        <div><img src="assets/Vector%20(2).png" alt="home"></div>
        <div><img src="assets/Search.png" alt="search"></div>
        <div><img src="assets/Add.png" alt="add"></div>
        <div><img src="assets/Like.png" alt="like"></div>
        <div><img src="assets/Frame.png" alt="frame"></div>
      </nav>
    </footer >
  </main>
</iphone-frame>

</body>
</html>
